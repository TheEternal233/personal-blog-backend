server:
  port: 8088
spring:
  config:
    import: application-secret.yml
  profiles:
    active: "@profiles.active@"

  # ✅ 正确邮箱配置（唯一一段，不会重复）
  mail:
    host: smtp.qq.com
    username: 2950355750@qq.com
    password: attxyzzuglmmdeif
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory

  security:
    jwt:
      key: jwt-key
      expire: 7

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog?useSSL=false&useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      port: 6379
      host: ${LINUX_HOST}
      timeout: 10000ms
      database: 3
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      password: ${REDIS_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: ${LINUX_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 6000
          multiplier: 2
          max-interval: 10000
    queue:
      email: email_queue
      log-login: log_login_queue
      log-system: log_system_queue
    exchange:
      email: email_exchange
      log: log_exchange
    routingKey:
      email: email_routing_key
      log-login: log_routing_key_login
      log-system: log_routing_key_system

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            dataSource: quartz_jobs
          dataSource:
            quartz_jobs:
              driver: com.mysql.cj.jdbc.Driver
              URL: jdbc:mysql://localhost:3306/blog?useSSL=false&useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
              user: root
              password: 4626463ljh.w

# ✅ 项目自定义邮箱配置（和spring.mail不冲突）
mail:
  from: 2950355750@qq.com
  link:
    apply:
      redirect-uri: http://localhost:8088/link/email/apply
  article-email-notice: true
  article-reply-notice: false
  message-email-notice: false
  message-new-notice: true
  message-reply-notice: true
  apply-notice: true
  pass-notice: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

web:
  index:
    path: http://localhost:99/

minio:
  endpoint: http://192.168.100.132:9000
  accessKey: ${MINIO_USERNAME}
  secretKey: ${MINIO_PASSWORD}
  bucketName: blog